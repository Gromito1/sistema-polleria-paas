<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - Pollos El Güero</title>
    <style>
        /* Paleta de colores: Pollos El Güero (Rojo, Amarillo, Negro) */
        body {
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        /* Contenedor principal estilo "Ventana" */
        .window-container {
            background-color: #f4f4f4;
            border: 3px solid #d32f2f;
            border-radius: 8px;
            width: 650px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Barra superior de la ventana */
        .title-bar {
            background-color: #d32f2f;
            color: white;
            padding: 5px 10px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-bottom: 2px solid #b71c1c;
        }

        .window-controls span {
            display: inline-block;
            width: 20px;
            height: 20px;
            text-align: center;
            line-height: 20px;
            margin-left: 5px;
            background-color: #fff;
            color: #d32f2f;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
            border: 1px solid #b71c1c;
        }

        .window-controls span:hover {
            background-color: #fbc02d;
            color: black;
        }

        /* Contenido principal */
        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .top-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        /* Sección del Logo */
        .logo-section {
            width: 40%;
            text-align: center;
        }

        .logo-section img {
            max-width: 180px;
            border-radius: 10px;
        }

        /* Sección del Formulario */
        .form-section {
            width: 55%;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-group label {
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 40%;
        }

        .input-group input {
            width: 50%;
            padding: 8px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 4px;
        }

        .input-group input:focus {
            border-color: #fbc02d;
            outline: none;
        }

     /* Contenedor del Password - Un poco más de aire */
        .password-container {
            width: 55%;
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-container input {
            width: 100%;
            /* Aumentamos el padding derecho para dar espacio justo al botón */
            padding-right: 38px; 
            box-sizing: border-box;
            font-size: 15px; /* Ajuste sutil para mejorar legibilidad */
        }

        /* Botón del ojito - Un poco más estilizado y pequeño */
        #btnVerPassword {
            position: absolute;
            right: 4px; /* Lo acercamos un poco más al borde derecho */
            width: 32px; /* Un poquito menos ancho */
            height: 26px; /* Altura ajustada para no "chocar" con los bordes del input */
            padding: 0;
            font-size: 14px;
            cursor: pointer;
            background-color: #f0f0f0; /* Color más suave */
            border: 1px solid #bbb;
            border-radius: 3px;
        }

        #btnVerPassword:hover {
            background-color: #d0d0d0;
        }

        /* Sección de Opciones (Botones Aceptar / Cancelar) */
        .options-section {
            border: 2px solid #555;
            padding: 15px;
            position: relative;
            margin-top: 10px;
            text-align: center;
            border-radius: 5px;
        }

        .options-section legend {
            font-size: 18px;
            font-weight: bold;
            background-color: #f4f4f4;
            padding: 0 10px;
            position: absolute;
            top: -12px;
            left: 20px;
        }

        .btn {
            padding: 10px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 10px;
            border: 2px solid #b71c1c;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .btn-aceptar {
            background-color: #d32f2f;
            color: white;
        }

        .btn-aceptar:hover {
            background-color: #fbc02d;
            color: black;
            border-color: #fbc02d;
        }

        .btn-cancelar {
            background-color: white;
            color: #d32f2f;
        }

        .btn-cancelar:hover {
            background-color: #ffebee;
        }

    </style>
</head>
<body>

    <div style="position: relative;">
        
        <div id="cajaErrores" style="display: none; position: absolute; bottom: 100%; left: 0; right: 0; margin-bottom: 15px; z-index: 9999; background-color: #ffebee; color: #c62828; border: 2px solid #c62828; padding: 12px; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); box-sizing: border-box;">
            <strong id="msgGeneral">login o Password, incorrecto</strong>
            <ul style="margin: 5px 0 0 0; padding-left: 20px; font-size: 15px; font-weight: bold; color: #666;">
                <li id="msgLogin" style="display: none;">en el Login: <span id="txtErrLogin" style="font-weight: normal;">No existe o formato incorrecto</span></li>
                <li id="msgPassword" style="display: none;">en el Password: <span id="txtErrPassword" style="font-weight: normal;">No existe o formato incorrecto</span></li>
            </ul>
        </div>
        <div class="window-container">
            <div class="title-bar">
                <div class="window-controls">
                    <span>_</span>
                    <span>□</span>
                    <span onclick="document.getElementById('cajaErrores').style.display = 'none'; window.close();">X</span>
                </div>
            </div>

            <div class="content">
                <div class="top-section">
                    <div class="logo-section">
                        <img src="vista/img/logo.jpg" alt="Logo Pollos El Güero">
                    </div>

                    <div class="form-section">
                        <div class="input-group">
                            <label for="txtLogin">LOGIN</label>
                            <input type="text" id="txtLogin" maxlength="16" placeholder="Usuario" autocomplete="off">
                        </div>
                        
                        <div class="input-group">
                            <label for="txtPassword">Password</label>
                            <div class="password-container">
                                <input type="password" id="txtPassword" maxlength="16" placeholder="Contraseña" autocomplete="new-password">
                                <button id="btnVerPassword" type="button" title="Mostrar/Ocultar" onclick="togglePass()">👁️</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="options-section">
                    <legend>Opciones</legend>
                    <button id="btnAceptar" class="btn btn-aceptar">Aceptar</button>
                    <button id="btnCancelar" class="btn btn-cancelar" onclick="document.getElementById('cajaErrores').style.display = 'none';">Cancel</button>
                </div>
            </div>
        </div>

    </div> 
    
    <script>
        function togglePass() {
            const p = document.getElementById("txtPassword");
            p.type = p.type === "password" ? "text" : "password";
        }
    </script>

    <script src="control/js/usuarioControl.js?v=12"></script>

</body>
</html>

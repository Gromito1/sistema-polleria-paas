<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mantenimiento de Personas - Pollos El Güero</title>
    <link rel="stylesheet" href="../css/personaVista.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <img src="../../img/logo.png" alt="Logo">
            <span>Pollos El Güero - Administración de Personal</span>
        </div>
        <button class="btn-regresar" onclick="window.location.href='mainMenVista.html'">Regresar al Menú</button>
    </header>

    <div class="main-container">
        <div class="form-card">
            <h2 class="form-title">Registro de Datos Personales</h2>
            
            <form id="formPersona">
                <div class="form-section">
                    <h3>Identificación Básica</h3>
                    <div class="row">
                        <div class="col">
                            <label>CURP:</label>
                            <input type="text" id="txtCurp" maxlength="18" placeholder="18 caracteres">
                        </div>
                        <div class="col">
                            <label>RFC:</label>
                            <input type="text" id="txtRfc" maxlength="13" placeholder="13 caracteres">
                        </div>
                        <div class="col">
                            <label>Tipo de Persona:</label>
                            <select id="selTpPerson">
                                <option value="">Seleccione...</option>
                                </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Nombre y Apellidos</h3>
                    <div class="row">
                        <div class="col">
                            <label>Nombre:</label>
                            <select id="selNombre">
                                <option value="">Seleccione...</option>
                                </select>
                        </div>
                        <div class="col">
                            <label>Apellido Paterno:</label>
                            <select id="selApePat">
                                <option value="">Seleccione...</option>
                                </select>
                        </div>
                        <div class="col">
                            <label>Apellido Materno:</label>
                            <select id="selApelMat">
                                <option value="">Seleccione...</option>
                                </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Demografía</h3>
                    <div class="row">
                        <div class="col">
                            <label>Género:</label>
                            <select id="selGenero">
                                <option value="">Seleccione...</option>
                                </select>
                        </div>
                        <div class="col">
                            <label>Fecha de Nacimiento:</label>
                            <input type="date" id="txtFecNac">
                        </div>
                        <div class="col">
                            <label>Edad:</label>
                            <input type="number" id="txtEdad" readonly>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Perfil Profesional</h3>
                    <div class="row">
                        <div class="col">
                            <label>Grado Académico:</label>
                            <select id="selGdoAca">
                                <option value="">Seleccione...</option>
                                </select>
                        </div>
                        <div class="col">
                            <label>Puesto:</label>
                            <select id="selPuesto">
                                <option value="">Seleccione...</option>
                                </select>
                        </div>
                        <div class="col">
                            <label>Departamento:</label>
                            <select id="selDepto">
                                <option value="">Seleccione...</option>
                                </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Contacto y Otros</h3>
                    <div class="row">
                        <div class="col">
                            <label>E-mail:</label>
                            <input type="email" id="txtEmail">
                        </div>
                        <div class="col">
                            <label>Teléfono:</label>
                            <input type="text" id="txtTel">
                        </div>
                        <div class="col">
                            <label>Afición:</label>
                            <select id="selAficion">
                                <option value="">Seleccione...</option>
                                </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-full">
                            <label>Notas:</label>
                            <textarea id="txtNotas" rows="2"></textarea>
                        </div>
                    </div>
                </div>

                <div class="options-container">
                    <button type="button" id="btnGuardar" class="btn btn-save">Guardar Registro</button>
                    <button type="button" id="btnLimpiar" class="btn btn-clear">Limpiar Formulario</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../control/js/personaControl.js"></script>
</body>
</html>

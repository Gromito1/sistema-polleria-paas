<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento de Usuarios - Pollos El Güero</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* TEMA OSCURO EMPRESARIAL */
        body { background-color: #0a0a0a; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .header-title { color: #ffc107; font-size: 22px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .main-layout { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
        .panel { background-color: #1a1a1a; border-radius: 12px; padding: 20px; border: 1px solid #333; box-shadow: 0 0 15px rgba(255, 0, 0, 0.15); }
        .panel-izquierdo { flex: 1; min-width: 500px; }
        .panel-derecho { width: 250px; display: flex; flex-direction: column; }
        .panel-titulo { color: #ffc107; font-size: 15px; font-weight: bold; text-align: center; margin-bottom: 25px; text-transform: uppercase; }

        #formUsuario { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 30px; }
        .input-group.full-width { grid-column: span 2; }
        .input-group label { display: block; color: #aaa; font-size: 13px; margin-bottom: 5px; }
        .form-control { width: 100%; background-color: #111; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 6px; box-sizing: border-box; transition: 0.3s; }
        .form-control:focus { border-color: #ffc107; outline: none; }
        .form-control:disabled { background-color: #111; color: #555; border-color: #222; }

        .btn { width: 100%; padding: 12px; margin-bottom: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: flex-start; gap: 12px; color: white; transition: 0.2s; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn i { width: 20px; text-align: center; }
        .btn-nuevo { background-color: #17a2b8; } 
        .btn-modif { background-color: #198754; } 
        .btn-borrar { background-color: #dc3545; } 
        .btn-cancelar { background-color: #333; border: 1px solid #444; }
        .btn-salir { background-color: #333; border: 1px solid #444; }

        .select-row { display: flex; gap: 10px; }
        .btn-plus { background-color: #ffc107; border: none; color: #000; border-radius: 6px; padding: 0 15px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .btn-plus:hover:not(:disabled) { background-color: #e0a800; }
        .btn-plus:disabled { background-color: #555; color: #222; cursor: not-allowed; }

        .pass-wrapper { position: relative; display: flex; align-items: center; }
        .btn-eye { position: absolute; right: 10px; background: none; border: none; color: #ffc107; cursor: pointer; }

        .estado-wrapper { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .btn-estado { background: transparent; border: none; color: #dc3545; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-estado.activo { color: #198754; }

        .panel-inferior { width: 100%; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        th { color: #ffc107; padding: 12px 10px; border-bottom: 2px solid #ffc107; text-align: left; }
        td { padding: 12px 10px; border-bottom: 1px solid #222; color: #ddd; }
        tr:hover td { background-color: #222; }
        .action-icons span { cursor: pointer; font-size: 15px; margin-right: 10px; }

        /* MODAL: Diseño del Gestor de Privilegios */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 9999;
        }
        .modal-panel {
            width: 450px; background-color: #1a1a1a; padding: 25px; border-radius: 12px;
            border: 1px solid #333; box-shadow: 0 0 20px rgba(255, 193, 7, 0.3);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 15px; }
        .btn-close-modal { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }
        .btn-close-modal:hover { color: #dc3545; }
    </style>
</head>
<body>

    <div class="header-title">
        <i class="fa-solid fa-users-gear"></i> Mantenimiento de Usuarios
        <span id="lblUsuarioActivo" style="display:none;"></span> 
    </div>

    <div class="main-layout">
        <div class="panel panel-izquierdo">
            <div class="panel-titulo">Datos de Acceso</div>
            <form id="formUsuario" autocomplete="off">
                <div class="input-group full-width">
                    <label>Nombre de la Persona (Vínculo):</label>
                    <div class="select-row">
                        <select id="selCvPerson" class="form-control" disabled>
                            <option value="">-- Seleccione una Persona --</option>
                        </select>
                        <button type="button" class="btn-plus" id="btnAbrirPrivilegios" title="Asignar Privilegios de Acceso">
                            <i class="fa-solid fa-key"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Login del Usuario:</label>
                    <input type="text" id="txtLogin" class="form-control" placeholder="11-16 caracteres" maxlength="16" autocomplete="nope" disabled>
                </div>

                <div class="input-group">
                    <label>Password del Usuario:</label>
                    <div class="pass-wrapper">
                        <input type="password" id="txtPassword" class="form-control" placeholder="16 caracteres" maxlength="16" autocomplete="new-password" disabled>
                        <button type="button" class="btn-eye" onclick="togglePass()" disabled><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Fecha de Inicio (FecIni):</label>
                    <input type="date" id="txtFecIni" class="form-control" disabled>
                </div>

                <div class="input-group">
                    <label>Fecha de Término (FecFin):</label>
                    <input type="date" id="txtFecFin" class="form-control" disabled>
                </div>

                <div class="input-group full-width">
                    <div class="estado-wrapper">
                        <label style="margin: 0;">Estado de la Cuenta:</label>
                        <button type="button" id="btnEdoCta" class="btn-estado activo" disabled>Activada</button>
                        <input type="hidden" id="hidEdoCta" value="1">
                    </div>
                </div>
            </form>
        </div>

        <div class="panel panel-derecho">
            <div class="panel-titulo">Opciones</div>
            <button type="button" id="btnNuevo" class="btn btn-nuevo"><i class="fa-solid fa-file"></i> Nuevo</button>
            <button type="button" id="btnModificar" class="btn btn-modif"><i class="fa-solid fa-pen-to-square"></i> Modificar</button>
            <button type="button" id="btnBorrar" class="btn btn-borrar"><i class="fa-solid fa-trash"></i> Eliminar</button>
            <button type="button" id="btnCancelar" class="btn btn-cancelar"><i class="fa-solid fa-xmark"></i> Cancelar</button>
            <button type="button" id="btnSalir" class="btn btn-salir" onclick="window.parent.mostrarBienvenida()"><i class="fa-solid fa-rotate-left"></i> Regresar</button>
        </div>
    </div>

    <div class="panel panel-inferior">
        <div class="panel-titulo" style="text-align: left; margin-bottom: 5px;">Rejilla de Datos (mUsuarios)</div>
        <table>
            <thead>
                <tr>
                    <th>Num</th>
                    <th>Nombre del Usuario(a)</th>
                    <th>Login</th>
                    <th>FecIni</th>
                    <th>FecFin</th>
                    <th>EdoCta</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaUsuarios">
                <tr><td colspan="7" style="text-align:center; padding: 20px;">Cargando registros...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="modalAccesos" class="modal-overlay">
        <div class="modal-panel">
            <div class="modal-header">
                <div class="panel-titulo" style="color: #ffc107; margin: 0;"><i class="fa-solid fa-shield-halved"></i> Gestor de Privilegios</div>
                <button type="button" id="btnCerrarModal" class="btn-close-modal" title="Cerrar"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="formAccesos" style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
                <div class="input-group" style="margin: 0;">
                    <label>Otorgando/Revocando accesos a la cuenta de:</label>
                    <input type="text" id="txtUsuarioModal" class="form-control" disabled style="color: #17a2b8; font-weight: bold; background-color: #111; text-align: center; font-size: 15px;">
                </div>
                
                <div class="input-group" style="margin: 0;">
                    <!-- MODIFICACIÓN: Nueva lista de opciones -->
                    <label>Nivel de Acceso:</label>
                    <select id="selAppModal" class="form-control">
                        <option value="">-- Seleccione el Nivel de Acceso --</option>
                        <option value="ACCESO_TOTAL">Acceso Total (Administrador Temporal)</option>
                    </select>
                </div>

                <div style="margin-top: 10px; display: flex; gap: 10px;">
                    <button type="button" id="btnGuardarAcceso" class="btn btn-modif" style="margin:0; flex:1;"><i class="fa-solid fa-floppy-disk"></i> Guardar Privilegio</button>
                    <button type="button" id="btnRevocarAccesos" class="btn btn-borrar" style="margin:0; flex:1;"><i class="fa-solid fa-trash-can"></i> Revocar Todo</button>
                </div>
            </form>
        </div>
    </div>

  <script src="../../control/js/usuariosControl.js?v=9999"></script>
</body>
</html>

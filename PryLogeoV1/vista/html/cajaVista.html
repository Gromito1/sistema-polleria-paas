<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Corte de Caja - Pollos El Güero</title>
    <link rel="stylesheet" href="../css/cajaVista.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <img src="../img/logo.jpg" alt="Logo Pollos">
            <span>Corte de Caja Diario</span>
        </div>
        <div class="header-actions">
            <span id="lblFechaActual" class="date-label">Fecha: --/--/----</span>
            
            <!-- NUEVO BOTÓN DE REINICIO -->
            <button onclick="reiniciarCaja()" style="background-color: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px; transition: 0.2s;">🗑️ Reiniciar Caja</button>
            
            <button class="btn-imprimir" onclick="imprimirYLimpiar()">🖨️ Imprimir Corte</button>
            <button class="btn-regresar" onclick="window.parent.mostrarBienvenida()">Volver al Menú</button>
        </div>
    </header>

    <div class="main-container">
        
        <div class="summary-cards">
            <div class="card card-tickets">
                <h3>Total de Tickets</h3>
                <p id="lblTotalTickets">0</p>
            </div>
            <div class="card card-money">
                <h3>Ingresos del Día</h3>
                <p id="lblTotalDinero">$0.00</p>
            </div>
        </div>

        <div class="details-panel">
            <h2 class="panel-title">Detalle de Ventas de Hoy</h2>
            <table class="sales-table">
                <thead>
                    <tr>
                        <th>Folio Ticket</th>
                        <th>Hora</th>
                        <th>Cajero</th>
                        <th>Total Cobrado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaCorte">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #666;">Cargando ventas del día...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- MODAL PARA VER EL DETALLE DEL TICKET -->
    <div id="modalDetalle" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 9999;">
        <div style="background-color: #1a1a1a; padding: 25px; border-radius: 12px; border: 1px solid #333; width: 500px; color: white;">
            <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px;">
                <h3 style="color: #ffc107; margin: 0;">Detalle de Venta #<span id="lblFolioModal"></span></h3>
                <button onclick="cerrarModal()" style="background:none; border:none; color:#aaa; font-size:20px; cursor:pointer;">X</button>
            </div>
            <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                <thead>
                    <tr style="color: #ffc107; border-bottom: 1px solid #ffc107; text-align: left;">
                        <th style="padding: 8px;">Cant</th>
                        <th style="padding: 8px;">Producto</th>
                        <th style="padding: 8px;">Precio</th>
                        <th style="padding: 8px;">SubT</th>
                    </tr>
                </thead>
                <tbody id="tablaDetalleTicket">
                    <tr><td colspan="4" style="text-align:center;">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Forzamos la actualización del caché en el JS -->
    <script src="../../control/js/cajaControl.js?v=20"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturación - Pollos El Güero</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* TEMA OSCURO - FACTURACIÓN */
        :root {
            --bg-dark: #0a0a0a;
            --bg-panel: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-gold: #ffc107;
            --btn-green: #28a745;
            --btn-blue: #007bff;
            --border-color: #333333;
            --input-bg: #2a2a2a;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        .header-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-gold);
        }

        /* DISEÑO A DOS COLUMNAS */
        .grid-container {
            display: flex;
            gap: 25px;
            flex-grow: 1;
            overflow: hidden;
        }

        .panel {
            background-color: var(--bg-panel);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Panel Izquierdo (35% de ancho) */
        .panel-ticket {
            flex: 0 0 35%;
        }

        /* Panel Derecho (65% de ancho) */
        .panel-fiscal {
            flex: 1;
        }

        .panel-title {
            font-size: 18px;
            color: white;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- ESTILOS BUSCADOR --- */
        .search-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .search-group input {
            flex-grow: 1;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
        }
        .btn-buscar {
            background-color: var(--btn-blue);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-buscar:hover { filter: brightness(1.2); }

        /* --- TARJETA DEL TICKET --- */
        .ticket-info {
            background-color: var(--input-bg);
            border: 1px dashed var(--text-muted);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: none; /* Se mostrará con JS */
        }
        .ticket-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .ticket-total {
            font-size: 20px;
            font-weight: bold;
            color: var(--btn-green);
            border-top: 1px solid #444;
            padding-top: 10px;
            margin-top: 10px;
            text-align: right;
        }

        /* --- FORMULARIO FISCAL --- */
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-size: 13px;
            color: var(--text-muted);
        }
        .form-input {
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .btn-facturar {
            background-color: var(--btn-green);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: auto; /* Empuja el botón al fondo */
            transition: 0.2s;
        }
        .btn-facturar:hover { filter: brightness(1.1); }
    </style>
</head>
<body>

    <div class="header-top">
        <i class="fa-solid fa-file-invoice-dollar" style="font-size: 28px; color: var(--accent-gold);"></i>
        <div class="header-title">Emisión de Facturas (CFDI)</div>
    </div>

    <div class="grid-container">
        
        <div class="panel panel-ticket">
            <h3 class="panel-title"><i class="fa-solid fa-receipt" style="color: var(--text-muted);"></i> Validar Ticket</h3>
            
            <label style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">Ingrese el Folio de Venta:</label>
            <div class="search-group">
                <input type="number" id="txtFolio" placeholder="Ej. 1045">
                <button class="btn-buscar" onclick="alert('Buscador en construcción')"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <div id="cajaTicket" class="ticket-info">
                <h4 style="text-align: center; margin-top: 0; color: var(--accent-gold);">TICKET ENCONTRADO</h4>
                <div class="ticket-row"><span>Folio:</span> <strong id="lblFolio">--</strong></div>
                <div class="ticket-row"><span>Fecha:</span> <strong id="lblFecha">--</strong></div>
                <hr style="border: 0; border-top: 1px dashed #555; margin: 15px 0;">
                <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">Artículos:</div>
                <div id="listaArticulos" style="font-size: 13px;">
                    </div>
                <div class="ticket-total">Total: $<span id="lblTotal">0.00</span></div>
            </div>
        </div>

        <div class="panel panel-fiscal">
            <h3 class="panel-title"><i class="fa-solid fa-building-user" style="color: var(--text-muted);"></i> Datos Fiscales del Receptor</h3>
            
            <div class="form-row">
                <div class="form-group" style="flex: 0 0 30%;">
                    <label>RFC:</label>
                    <input type="text" id="txtRFC" class="form-input" placeholder="Ej. XAXX010101000" style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label>Razón Social (Nombre):</label>
                    <input type="text" id="txtNombre" class="form-input" placeholder="Nombre completo o Empresa">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 0 0 25%;">
                    <label>Código Postal:</label>
                    <input type="number" id="txtCP" class="form-input" placeholder="Ej. 29000">
                </div>
                <div class="form-group">
                    <label>Régimen Fiscal:</label>
                    <select id="selRegimen" class="form-input">
                        <option value="">Seleccione una opción...</option>
                        <option value="601">601 - General de Ley Personas Morales</option>
                        <option value="605">605 - Sueldos y Salarios e Ingresos Asimilados</option>
                        <option value="612">612 - Personas Físicas con Actividades Empresariales</option>
                        <option value="616">616 - Sin obligaciones fiscales</option>
                        <option value="626">626 - Régimen Simplificado de Confianza (RESICO)</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Uso de CFDI:</label>
                    <select id="selUsoCFDI" class="form-input">
                        <option value="">Seleccione una opción...</option>
                        <option value="G01">G01 - Adquisición de mercancias</option>
                        <option value="G03">G03 - Gastos en general</option>
                        <option value="P01">P01 - Por definir</option>
                        <option value="S01">S01 - Sin efectos fiscales</option>
                    </select>
                </div>
            </div>

            <button class="btn-facturar" onclick="alert('Generación en construcción')">
                <i class="fa-solid fa-stamp"></i> Emitir y Generar Factura
            </button>
        </div>

    </div>

    <script src="../../control/js/facturasControl.js?v=1"></script>
</body>
</html>
